name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile production-apk --non-interactive --wait --output ./cufa.apk

      - name: Build AAB
        run: eas build --platform android --profile production --non-interactive --wait --output ./cufa.aab

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/cufa.apk
            app/cufa.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}